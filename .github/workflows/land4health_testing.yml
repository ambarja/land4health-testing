name: land4health - testing 𖥂🎮

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # 07:00 Perú

jobs:
  build-and-deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEE_SA_KEY_B64: ${{ secrets.GEE_SA_KEY_B64 }}
      GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Dependencias del sistema SOLO en Linux (útil si sf/terra están en tus deps)
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libfontconfig1-dev \
            libxml2-dev

      - name: Install R packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org")'
          Rscript -e 'pak::pak(c("harmonize-tools/land4health", "ambarja/geoidep", "rgee"))'

      # Escribir el JSON desde base64 (portable en los 3 SO) y exportar envs
      - name: Write EE Service Account JSON + export env
        run: |
          python - <<PY
          import os, base64, sys
          b64 = os.environ.get("GEE_SA_KEY_B64", "")
          if not b64:
              sys.exit("GEE_SA_KEY_B64 vacío")
          key_path = os.path.join(os.environ["RUNNER_TEMP"], "ee-key.json")
          with open(key_path, "wb") as f:
              f.write(base64.b64decode(b64))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GOOGLE_APPLICATION_CREDENTIALS={key_path}\n")
              f.write(f"GEE_PROJECT_ID={os.environ.get('GEE_PROJECT_ID','')}\n")
          print("Key written to:", key_path)
          PY

      # Todo en UNA sesión R: crea/usa el entorno Python con l4h_* y ejecuta main.R

      - name: Run processing script
        run: Rscript main.R
      
      - name: Successful
        run: echo "✅ Workflow successful"

      - name: Successful
        run: echo "✅ Workflow successful on ${{ matrix.os }}"
