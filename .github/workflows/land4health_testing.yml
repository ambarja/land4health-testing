name: land4health - testing 𖥂🎮

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # 07:00 Perú

jobs:
  build-and-deploy:
    runs-on: macos-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEE_SA_KEY_B64: ${{ secrets.GEE_SA_KEY_B64 }}
      GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      # 🔹 Asegura que haya un python3 disponible y “limpio”
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org")'
          Rscript -e 'pak::pak(c("harmonize-tools/land4health", "ambarja/geoidep"))'

      - name: Write EE Service Account JSON
        env:
          GEE_SA_KEY_B64: ${{ secrets.GEE_SA_KEY_B64 }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
        run: |
          echo "$GEE_SA_KEY_B64" | base64 -d > "$RUNNER_TEMP/ee-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ee-key.json" >> "$GITHUB_ENV"
          echo "GEE_PROJECT_ID=$GEE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: land4health install + run main.R
        run: |
          Rscript - <<'R'
          library(land4health)

          # 1) Crear (o recrear) el entorno con virtualenv en vez de 'auto/uv'
          l4h_install(
            method = "virtualenv",
            force  = TRUE
          )

          # 2) Usar el mismo entorno desde reticulate/rgee
          l4h_use_python()  # asumiendo que esta función ya existe en el paquete

          # 3) Ejecutar tu script principal
          source("main.R")
          R

      - name: Successful
        run: echo "✅ Workflow successful"
