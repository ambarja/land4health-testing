name: Harmonize > Geodroneapp 🗺️ 𖥂🎮 

on:
  push:
    branches: [main]
  workflow_dispatch:
  #schedule:
   # - cron: '0 12 * * *'  # corre diariamente a las 12:00 UTC = 07:00 Perú

jobs:
  build-and-deploy:
    runs-on: macos-latest
    permissions:
      contents: write
    

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.2'
        use-public-rspm: true

    # 1) Instalar Python en el runner
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 2) Crear virtualenv para land4health / rgee y definir RETICULATE_PYTHON
    - name: Create virtualenv for land4health / rgee
      run: |
        mkdir -p "$HOME/.virtualenvs"
        python -m venv "$HOME/.virtualenvs/r-land4health"
        source "$HOME/.virtualenvs/r-land4health/bin/activate"
        python -m pip install --upgrade pip
        python -m pip install earthengine-api numpy pandas
        echo "RETICULATE_PYTHON=$HOME/.virtualenvs/r-land4health/bin/python" >> "$GITHUB_ENV"

    - name: Install R packages
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Rscript -e 'install.packages(c("pak", "remotes","ggplot2"))'
        Rscript -e 'pak::pkg_install("harmonize-tools/land4health")'
        Rscript -e 'pak::pkg_install("ambarja/geoidep")'

    - name: Write EE Service Account JSON
      env:
        GEE_SA_KEY_B64: ${{ secrets.GEE_SA_KEY_B64 }}
        GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
      run: |
        echo "$GEE_SA_KEY_B64" | base64 -d > "$RUNNER_TEMP/ee-key.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ee-key.json" >> "$GITHUB_ENV"
        echo "GEE_PROJECT_ID=$GEE_PROJECT_ID" >> "$GITHUB_ENV"

    # Aquí RETICULATE_PYTHON ya está definido gracias al paso del virtualenv
    - name: rgee install via land4health
      run: Rscript -e "library('land4health'); l4h_install(force = TRUE, restart = FALSE)"

    - name: Run processing script
      run: Rscript main.R
      
    - name: Commit README + figures
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git status
        git add README.md figures/ || echo "No figures to add"
        git commit -m "Update README and figures with latest results" || echo "No changes to commit"
        git push    
        
    - name: Successful
      run: echo "✅ Workflow successful"
