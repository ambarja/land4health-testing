name: land4health - testing 𖥂🎮

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # 07:00 Perú

jobs:
  build-and-deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEE_SA_KEY_B64: ${{ secrets.GEE_SA_KEY_B64 }}
      GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Deps nativas para sf/terra en Linux
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libfontconfig1-dev \
            libxml2-dev

      - name: Setup Python (for tools & Windows availability)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instalar rgee fijado y luego tus paquetes (evita conflictos de versión)
      - name: Install R packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
          Rscript -e 'pak::pkg_install("cran::rgee@=1.1.7", upgrade = FALSE)'
          Rscript -e 'pak::pkg_install(c("github::harmonize-tools/land4health", "github::ambarja/geoidep"), upgrade = FALSE)'

      # Escribir ee-key.json (Windows con PowerShell)
      - name: Write EE key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b64 = $env:GEE_SA_KEY_B64
          if (-not $b64) { throw "GEE_SA_KEY_B64 vacío" }
          $keyPath = Join-Path $env:RUNNER_TEMP "ee-key.json"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($b64))
          "GOOGLE_APPLICATION_CREDENTIALS=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GEE_PROJECT_ID=$($env:GEE_PROJECT_ID)"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Key written to: $keyPath"

      # Escribir ee-key.json (Linux/macOS con Bash + Python heredoc)
      - name: Write EE key (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import os, base64, sys
          b64 = os.environ.get("GEE_SA_KEY_B64", "")
          if not b64:
              sys.exit("GEE_SA_KEY_B64 vacío")
          key_path = os.path.join(os.environ["RUNNER_TEMP"], "ee-key.json")
          with open(key_path, "wb") as f:
              f.write(base64.b64decode(b64))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GOOGLE_APPLICATION_CREDENTIALS={key_path}\n")
              f.write(f"GEE_PROJECT_ID={os.environ.get('GEE_PROJECT_ID','')}\n")
          print("Key written to:", key_path)
          PY

      # Crear/usar entorno Python y exportar RETICULATE_PYTHON automáticamente (SO-agnóstico)
      - name: land4health install + export RETICULATE_PYTHON
        run: |
          Rscript - <<'R'
          library(land4health)
          l4h_install()      # crea/reusa el venv con earthengine-api
          l4h_use_python()   # selecciona ese venv para reticulate/rgee
          py <- reticulate::py_executable()
          cat(sprintf("RETICULATE_PYTHON=%s\n", py),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          message("RETICULATE_PYTHON = ", py)
          R

      - name: Run processing script
        run: Rscript main.R

      - name: Successful
        run: echo "✅ Workflow successful on ${{ matrix.os }}"
