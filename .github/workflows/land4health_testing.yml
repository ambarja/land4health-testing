name: land4health - testing 𖥂🎮

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # 07:00 Perú

jobs:
  build-and-deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEE_SA_KEY_B64: ${{ secrets.GEE_SA_KEY_B64 }}
      GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Deps nativas para sf/terra en Linux
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libfontconfig1-dev \
            libxml2-dev

      - name: Setup Python (for base64 & ensure availability on Windows)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install R packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org")'
          Rscript -e 'pak::pak(c("harmonize-tools/land4health","ambarja/geoidep"))'

      # Escribir ee-key.json de forma portable (igual en Linux/macOS/Windows)
      # Windows — usa PowerShell (sin heredoc)
      - name: Write EE key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b64 = $env:GEE_SA_KEY_B64
          if (-not $b64) { throw "GEE_SA_KEY_B64 vacío" }
          $keyPath = Join-Path $env:RUNNER_TEMP "ee-key.json"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($b64))
          "GOOGLE_APPLICATION_CREDENTIALS=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GEE_PROJECT_ID=$($env:GEE_PROJECT_ID)"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Key written to: $keyPath"
      
      - name: Write EE Service Account JSON + export env
        if: runner.os != 'Windows'
        run: |
          python - <<'PY'
          import os, base64, sys
          b64 = os.environ.get("GEE_SA_KEY_B64", "")
          if not b64:
              sys.exit("GEE_SA_KEY_B64 vacío")
          key_path = os.path.join(os.environ["RUNNER_TEMP"], "ee-key.json")
          with open(key_path, "wb") as f:
              f.write(base64.b64decode(b64))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GOOGLE_APPLICATION_CREDENTIALS={key_path}\n")
              f.write(f"GEE_PROJECT_ID={os.environ.get('GEE_PROJECT_ID','')}\n")
          print("Key written to:", key_path)
          PY

      # Crear/usar entorno Python con l4h_* y ejecutar tu script en una MISMA sesión R
      - name: land4health install
        run: Rscript -e 'library(land4health); l4h_install();l4h_use_python()'
        
      # --- Set RETICULATE_PYTHON por SO ---
      - name: Point reticulate to r-land4health venv (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "RETICULATE_PYTHON=$HOME/.virtualenvs/r-land4health/bin/python" >> "$GITHUB_ENV"
      
      - name: Point reticulate to r-land4health venv (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "RETICULATE_PYTHON=$HOME/.virtualenvs/r-land4health/bin/python" >> "$GITHUB_ENV"
      
      - name: Point reticulate to r-land4health venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "RETICULATE_PYTHON=$($env:USERPROFILE)\.virtualenvs\r-land4health\Scripts\python.exe"

          
      - name: Run processing script
        run: Rscript main.R
    
      - name: Successful
        run: echo "✅ Workflow successful"
